[project]
name = "kds-team-ex-heureka"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "keboola.component==1.4.4",
    "keboola.utils==1.1.0",
    "keboola.http-client==1.0.0",
    "dataconf==2.5.0",
    "requests-html==0.10.0",
    "keboola.csvwriter==1.0.1",
    "lxml==5.1.0",
    "playwright==1.58.0",
    "backoff==2.2.1",
    "kbcstorage==0.9.5",
]

[project.optional-dependencies]
dev = [
    "mock==5.1.0",
    "freezegun==1.4.0",
    "ruff",
]

[tool.ruff]
line-length = 120
exclude = ["__pycache__", ".git", ".venv", "venv", "docs"]
